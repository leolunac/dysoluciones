{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Mis Unidades</h2>

    <p class="text-muted">
        Seleccione la unidad que desea consultar.
    </p>

    <div class="row">

        {% for cliente in clientes %}

        <div class="col-md-6 col-lg-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        {{ cliente.nombre }}
                    </h5>

                    <p class="card-text">
                        {{ cliente.direccion }}
                    </p>

                    <a
                        href="{% url 'dashboard_cliente' cliente.id %}"
                        class="btn btn-primary w-100"
                    >
                        Ingresar
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
