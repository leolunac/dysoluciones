{% load static %}
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo proveedor | SIGOB</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6f8,#f8fafc);color:#17324d;margin:0}.contenedor{max-width:760px;margin:30px auto;padding:0 18px}.cabecera{background:linear-gradient(120deg,#064d73,#0879ad);color:white;padding:18px 22px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px #0759852b}.logo{width:66px;height:66px;object-fit:contain;background:white;padding:5px;border-radius:12px}.cabecera h1{margin:0;font-size:23px}.cabecera p{margin:5px 0 0;font-size:12px}.tarjeta{background:white;margin-top:14px;padding:22px;border:1px solid #dce7ef;border-radius:12px;box-shadow:0 3px 12px #0f172a0d}.campo{margin-bottom:13px}label{font-weight:bold;display:block;margin-bottom:5px;font-size:13px}input{width:100%;padding:10px;border:1px solid #b9cbd8;border-radius:7px}input:focus{outline:3px solid #0ea5e92b;border-color:#0b83b8}input[type=checkbox]{width:auto}.btn{padding:10px 14px;border:0;border-radius:7px;color:white;background:#15803d;font-weight:bold;text-decoration:none;display:inline-block;cursor:pointer}.gris{background:#52677a}.errores{color:#b91c1c;font-size:12px}</style></head>
<body><main class="contenedor"><header class="cabecera"><img class="logo" src="{% static 'img/logo_dys.png' %}" alt="Logo D&S"><div><h1>Crear proveedor</h1><p>SIGOB 7x24 · D&amp;S Soluciones en Bombeo S.A.S.</p></div></header><form method="post" class="tarjeta">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="campo"><label>{{ field.label }}</label>{{ field }}<div class="errores">{{ field.errors }}</div></div>{% endfor %}<button class="btn" type="submit">Guardar proveedor</button> <a class="btn gris" href="{% url 'inventario:nueva_entrada' %}">Cancelar</a></form></main></body></html>
