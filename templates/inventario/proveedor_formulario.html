<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo proveedor | SIGOB</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6f9;color:#17324d;margin:0}.contenedor{max-width:760px;margin:30px auto;padding:0 18px}.cabecera{background:#075985;color:white;padding:18px;border-radius:10px}.tarjeta{background:white;margin-top:14px;padding:18px;border-radius:10px}.campo{margin-bottom:12px}label{font-weight:bold;display:block;margin-bottom:4px}input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px}input[type=checkbox]{width:auto}.btn{padding:10px 14px;border:0;border-radius:7px;color:white;background:#15803d;font-weight:bold;text-decoration:none;display:inline-block;cursor:pointer}.gris{background:#64748b}.errores{color:#b91c1c}</style></head>
<body><main class="contenedor"><header class="cabecera"><h1 style="margin:0">Crear proveedor</h1></header><form method="post" class="tarjeta">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="campo"><label>{{ field.label }}</label>{{ field }}<div class="errores">{{ field.errors }}</div></div>{% endfor %}<button class="btn" type="submit">Guardar proveedor</button> <a class="btn gris" href="{% url 'inventario:nueva_entrada' %}">Cancelar</a></form></main></body></html>
