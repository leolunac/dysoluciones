{% extends "base.html" %}

{% block extra_css %}
<style>
.gh-wrap{max-width:1450px;margin:0 auto}.gh-hero{background:linear-gradient(120deg,#073b6f,#0b78a5);color:#fff;padding:22px 25px;border-radius:14px;margin-bottom:18px;display:flex;justify-content:space-between;gap:18px;align-items:center}.gh-hero h1{margin:0 0 5px;font-size:25px}.gh-hero p{margin:0;opacity:.9}.gh-grid{display:grid;gap:13px}.gh-kpis{grid-template-columns:repeat(5,1fr);margin-bottom:18px}.gh-card{background:#fff;border:1px solid #e0e7ef;border-radius:12px;padding:17px;box-shadow:0 3px 12px #0f172a0c}.gh-kpi strong{display:block;font-size:27px;color:#073b6f;margin-top:6px}.gh-btn{display:inline-block;border:0;border-radius:7px;padding:10px 13px;background:#075b94;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.gh-btn.secondary{background:#e8eef4;color:#17324d}.gh-btn.success{background:#177a48}.gh-table{width:100%;border-collapse:collapse}.gh-table th{background:#eaf1f6;color:#17324d;text-align:left}.gh-table th,.gh-table td{padding:10px;border-bottom:1px solid #e3eaf0;vertical-align:top}.gh-badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#e8eef4;font-size:11px;font-weight:700}.gh-badge.ACTIVO{background:#dcfce7;color:#166534}.gh-badge.INACTIVO,.gh-badge.RETIRADO{background:#f1f5f9;color:#475569}.gh-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.gh-field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px;color:#334155}.gh-field input,.gh-field select,.gh-field textarea{width:100%;padding:9px;border:1px solid #bdcad6;border-radius:7px;background:#fff}.gh-errors{color:#991b1b;font-size:12px;margin-top:4px}.gh-messages{margin-bottom:14px}.gh-message{padding:11px;border-radius:8px;background:#e8f5ec;color:#166534;margin-bottom:6px}.gh-message.error{background:#fee2e2;color:#991b1b}.gh-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.gh-section h2{margin-top:0;color:#073b6f}.gh-muted{color:#64748b;font-size:12px}.gh-photo{width:135px;height:155px;object-fit:cover;border-radius:10px;border:1px solid #d6e0e8;background:#eef3f6}.gh-alert{border-left:5px solid #f59e0b}.gh-danger{border-left-color:#dc2626}@media(max-width:1100px){.gh-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.gh-kpis,.gh-form-grid,.gh-tabs{grid-template-columns:1fr}.gh-hero{align-items:flex-start;flex-direction:column}.gh-table-wrap{overflow:auto}}
</style>
{% endblock %}

{% block content %}
<div class="gh-wrap">
{% if messages %}<div class="gh-messages">{% for message in messages %}<div class="gh-message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
{% block gestion_humana_content %}{% endblock %}
</div>
{% endblock %}
